name: 🐛 Bug | Bug Report
description: Report a bug or unusual issue | Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting an issue, please make sure you have read the following documentation:[Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-) or [quick start (Chinese)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B-). **
        
        **Before submitting an issue, please make sure you've read the following documentation: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md# system-requirements-) or [Quick Start (Chinese)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B-).**
        
  - type: textarea
    attributes:
      label: Problem description | Current Behavior
      description: |
        Describe the problem you are experiencing
        Describe the issue you're experiencing
      placeholder: |
        When I execute...During operation, the program appears...question
        When I perform..., the program shows...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce | Steps to Reproduce
      description: |
        Detailed description of how to reproduce this issue
        Describe in detail how to reproduce this issue
      placeholder: |
        1. Open...
        2. Click...
        3. An error occurred...
        
        1. Open...
        2. Click on...
        3. Error occurs...
    validations:
      required: true
  - type: textarea
    attributes:
      label: error log | Error Logs
      description: |
        Please provide relevant error information or logs (be careful not to include sensitive information)
        Please provide any error messages or logs (be careful not to include sensitive information)
      placeholder: |
        Error messages, logs or screenshots...
        Error messages, logs, or screenshots...
    validations:
      required: true
  - type: input
    attributes:
      label: Python Version | Python Version
      description: |
        you use Python Version
        The Python version you're using
      placeholder: v3.13.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: operating system | Operating System
      description: |
        Your operating system information
        Your operating system information
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: MoneyPrinterTurbo Version | Version
      description: |
        you use MoneyPrinterTurbo Version
        The version of MoneyPrinterTurbo you're using
      placeholder: v1.2.2, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Supplementary information | Additional Information
      description: |
        Other information that is helpful in solving the problem (such as screenshots, videos, etc.)
        Any other information that might help solve the issue (screenshots, videos, etc.)
    validations:
      required: false