# illustrate:
# 1. The main dependency sources are unified into pyproject.toml.
# 2. The operating environment is fixed through uv.lock to prevent different machines from parsing different version combinations.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "videocraft-ai"
version = "1.3.4"
description = "VideoCraft AI - Generate short videos and reels from prompts, assets, subtitles, and AI TTS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI needs to add the project root directory to sys.path before importing the app package.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Statistical branch coverage can identify situations where a line of code is executed, but another branch of the condition is never verified.
# It is more suitable as a CI quality baseline than just counting row coverage. Both CLI and WebUI belong to the production entrance,
# Therefore, together with the app service layer, service startup portal and Skill script published for Agent users,
# Include statistics to prevent coverage from only reflecting local modules.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# The measured branch coverage for both Python 3.11 and 3.13 full tests exceeds 70.4%. Take 70%
# As a stable bottom line, it can solidify failure status, asynchronous release recovery and Redis atomic update testing,
# Also leave margin for small branch differences between different Python versions and operating systems.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# The current project is mainly in application running form and is not installed as a releasable Python package.
package = false
